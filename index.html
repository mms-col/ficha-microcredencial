<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha de microcredencial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
/* Plan: herramienta de trabajo sobria. Columna lateral de pasos + tarjeta de un solo campo.
   Verde azulado como acento; rojo/verde/ámbar solo para estados de validación. */
:root {
  color-scheme: light;
  --bg: #f3f6f5;
  --surface: #ffffff;
  --ink: #1b2a2a;
  --muted: #566665;
  --line: #d3dcda;
  --accent: #0e6e68;
  --accent-ink: #ffffff;
  --accent-soft: #dff0ee;
  --ok: #1c7a44;
  --ok-soft: #e1f3e8;
  --bad: #b3261e;
  --bad-soft: #fbe5e3;
  --warn: #8a5a00;
  --warn-soft: #fbf0d6;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1918; --surface: #172524; --ink: #e4efed; --muted: #9db3b0; --line: #2b3f3d;
    --accent: #5cc6bd; --accent-ink: #06201e; --accent-soft: #1a3a38;
    --ok: #6fd199; --ok-soft: #173326; --bad: #ff8a80; --bad-soft: #3a1d1b; --warn: #f0c15a; --warn-soft: #3a2f12;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1918; --surface: #172524; --ink: #e4efed; --muted: #9db3b0; --line: #2b3f3d;
  --accent: #5cc6bd; --accent-ink: #06201e; --accent-soft: #1a3a38;
  --ok: #6fd199; --ok-soft: #173326; --bad: #ff8a80; --bad-soft: #3a1d1b; --warn: #f0c15a; --warn-soft: #3a2f12;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: 26px; } h2 { font-size: 22px; } h3 { font-size: 17px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.app-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.app-bar .brand { font-family: var(--font-display); font-size: 19px; font-weight: 600; margin-right: auto; }
.save-state { font-size: 13px; color: var(--muted); }
.save-state.err { color: var(--bad); }
.bar-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 24px; max-width: 1180px; margin: 0 auto; padding: 24px 20px 64px; }
.steps { position: sticky; top: 76px; align-self: start; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.steps ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.step-btn { display: grid; grid-template-columns: 24px 1fr auto; gap: 8px; align-items: center; width: 100%; text-align: left; padding: 7px 8px; border: 0; background: transparent; border-radius: 7px; cursor: pointer; }
.step-btn:hover:not(:disabled) { background: var(--accent-soft); }
.step-btn[aria-current="step"] { background: var(--accent-soft); font-weight: 600; }
.step-btn:disabled { opacity: .5; cursor: not-allowed; }
.step-num { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
.dot { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; border: 1.5px solid var(--line); color: var(--muted); }
.dot.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.dot.okdet { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.dot.fail { background: var(--bad); border-color: var(--bad); color: #fff; }
.progress { height: 6px; background: var(--line); border-radius: 3px; margin: 4px 8px 10px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }
.steps-mobile { display: none; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
.card + .card { margin-top: 16px; }
.eyebrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; margin-bottom: 6px; }
.chip { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.need { margin: 8px 0 16px; max-width: 68ch; }
.criteria { margin: 0 0 16px; padding: 12px 14px 12px 32px; background: var(--bg); border-radius: 8px; max-width: 72ch; }
.criteria li { margin: 3px 0; }
.criteria-title { font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 4px; }
.example { border-left: 4px solid var(--accent); background: var(--accent-soft); padding: 10px 14px; border-radius: 0 8px 8px 0; margin: 0 0 20px; max-width: 72ch; }
.example .ex-title { font-size: 13px; font-weight: 600; color: var(--accent); margin: 0 0 4px; }
.example p { margin: 4px 0; }
.form { display: flex; flex-direction: column; gap: 16px; max-width: 72ch; }
.ctl { display: flex; flex-direction: column; gap: 5px; }
.ctl > label, .ctl > .lbl { font-weight: 600; font-size: 14px; }
.hint { color: var(--muted); font-size: 13px; }
input[type="text"], input[type="number"], input[type="url"], select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
textarea { min-height: 84px; resize: vertical; }
input[type="number"] { font-variant-numeric: tabular-nums; }
.check { display: flex; gap: 8px; align-items: flex-start; }
.check input { margin-top: 4px; }
.rows { display: flex; flex-direction: column; gap: 10px; }
.row { border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
.row-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
.refs { display: flex; flex-wrap: wrap; gap: 6px 12px; }
.refs label { display: inline-flex; gap: 5px; align-items: center; font-weight: 400; font-size: 14px; }
.live { font-variant-numeric: tabular-nums; padding: 8px 12px; background: var(--accent-soft); border-radius: 8px; font-weight: 500; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.nav { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); }
.nav .spacer { margin-left: auto; }
.verdict { margin-top: 18px; max-width: 72ch; }
.verdict .box { border-radius: 9px; padding: 12px 14px; border: 1px solid; }
.verdict .box.ok { background: var(--ok-soft); border-color: var(--ok); }
.verdict .box.fail { background: var(--bad-soft); border-color: var(--bad); }
.verdict .box.info { background: var(--warn-soft); border-color: var(--warn); }
.verdict h3 { font-size: 16px; margin-bottom: 6px; font-family: var(--font-body); font-weight: 600; }
.verdict ul { margin: 6px 0 0; padding-left: 20px; }
.verdict li { margin: 4px 0; }
.verdict .warns { margin-top: 8px; color: var(--warn); }
.attach { margin-top: 4px; padding: 12px; border: 1px dashed var(--line); border-radius: 9px; max-width: 72ch; }
.attach ul { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-direction: column; gap: 6px; }
.attach li { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.banner { padding: 10px 14px; border-radius: 9px; background: var(--warn-soft); color: var(--warn); margin-bottom: 14px; max-width: 72ch; }
.banner.ai { background: var(--accent-soft); color: var(--accent); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
table.tbl th, table.tbl td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.scroll-x { overflow-x: auto; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; z-index: 20; }
.modal { background: var(--surface); border-radius: 12px; padding: 22px; max-width: 440px; width: 100%; }
.modal p { margin: 8px 0 18px; }
.modal .btns { display: flex; justify-content: flex-end; gap: 10px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; z-index: 30; max-width: 90vw; }
.muted { color: var(--muted); }
@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; padding: 16px; }
  .steps { display: none; }
  .steps-mobile { display: block; margin-bottom: 12px; }
  .steps-mobile select { font-weight: 600; }
  .card { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) { .progress > i { transition: none; } }
</style>
</head>
<body>
<header class="app-bar">
  <div class="brand">Ficha de microcredencial</div>
  <span id="cur-name" class="save-state" style="font-weight:600"></span>
  <span id="save-state" class="save-state" role="status" aria-live="polite"></span>
  <div class="bar-actions" id="bar-actions"></div>
</header>
<div class="layout">
  <nav class="steps" id="steps" aria-label="Pasos de la ficha"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div id="layer"></div>

<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script>
"use strict";
/* ============================================================
   Ficha de microcredencial: asistente por compuertas (14 campos)
   Los criterios son criterios de calidad de esta herramienta, apoyados en
   el Marco de referencia de UNESCO IESALC (2026), que no es prescriptivo.
   ============================================================ */
const PD = "[por definir por la institución emisora]";
const PC = "[por confirmar]";
const KEY_PREFIX = "ficha-micro-v2:";
const KEY_INDEX = "ficha-micro-v2-index";
const LEGACY_KEY = "ficha-microcredencial-v1";

/* ---------- utilidades ---------- */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === false || v == null) continue;
    if (k === "class") el.className = v;
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else if (k.slice(0, 2) === "on" && typeof v === "function") el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const words = (s) => String(s || "").trim().split(/\s+/).filter(Boolean);
const clean = (s) => String(s == null ? "" : s).trim();
const num = (v) => { const t = String(v == null ? "" : v).trim().replace(",", "."); if (t === "") return NaN; const n = Number(t); return Number.isFinite(n) ? n : NaN; };
const clone = (o) => JSON.parse(JSON.stringify(o));
const fmtH = (n) => (Math.round(n * 100) / 100).toString().replace(".", ",");
function slug(s) { return clean(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) || "ficha-microcredencial"; }

const NOT_EVIDENCIABLE = /\bconoc(?:er|e|en|erá|erán|zca|zcan|ce|cen)\b|\bcomprend(?:er|e|en|erá|erán|a|an)\b|\bentend(?:er|erá|erán)\b|\bentiend(?:e|en|a|an)\b|\bfamiliariz(?:ar|arse|a|an|ará|arán|e|en)\b|\bapreci(?:ar|a|an|ará|arán|e|en)\b|\bsab(?:er|e|en|rá|rán|a|an)\b/i;
const FIRST_NOT_EVIDENCIABLE = /^(conoc|comprend|entend|entiend|familiariz|aprecia|saber$|sabe$|sabr)/i;
const LOOKS_VERB = /(ar|er|ir|ír|ará|erá|irá|arán|erán|irán)(se|lo|la|los|las|le|les|me|te|nos)?$/i;
const SUBJETIVO = /\b(empátic\w*|adecuad\w*|bueno|buena|apropiad\w*|creativ\w*|interesante|correcto|correcta)\b/i;
const CONDICIONAL = /\b(si (esto )?aplica|cuando corresponda|de ser necesario|si es el caso|según el caso)\b/i;
const AVALES = /\b(unesco|iesalc|onu|naciones unidas|avalad\w*|aval|oficial)\b/i;

const E = (msg, hint) => ({ type: "error", msg, hint: hint || "" });
const W = (msg) => ({ type: "warn", msg });

function coverageErrors(items, resultados, label) {
  const out = [];
  const covered = new Set();
  items.forEach((it) => (it.refs || []).forEach((r) => covered.add(Number(r))));
  resultados.forEach((r) => {
    if (!covered.has(r.n)) out.push(E(`El resultado ${r.n} («${r.text.slice(0, 60)}${r.text.length > 60 ? "…" : ""}») no queda cubierto por ${label}.`, `Marca el resultado ${r.n} en al menos una fila.`));
  });
  return out;
}

/* ---------- definición de los 14 campos ---------- */
const OPT_MODO = [["", "Elige…"], ["dirigida", "Dirigida por el instructor"], ["autonoma", "Aprendizaje autónomo"]];
const FIELDS = [
  {
    id: 1, short: "Nombre", title: "Nombre de la microcredencial", tag: "Diseño i",
    need: "Escribe el nombre con el que se conocerá la microcredencial.",
    criteria: ["Es específico: tema más enfoque o acción.", "Tiene como máximo unas 12 palabras.", "No contiene marcas, sellos ni promesas de aval de entidades que no sean el emisor."],
    example: ["Crear contenido digital sobre cambio climático para una comunidad local. Es específico, tiene 10 palabras y no promete avales de terceros.", "Un nombre débil sería «Curso de sostenibilidad avanzada con certificación internacional»: es genérico y promete un aval."],
    controls: [{ key: "nombre", type: "text", label: "Nombre", placeholder: "Verbo o tema + enfoque" }],
    validate(v) {
      const out = [], n = clean(v.nombre), w = words(n);
      if (!n) return [E("Escribe el nombre.")];
      if (w.length < 3) out.push(E("El nombre es demasiado corto para ser específico.", "Incluye el tema y el enfoque o la acción."));
      if (w.length > 12) out.push(E(`El nombre tiene ${w.length} palabras; el máximo es unas 12.`, "Acórtalo conservando el tema y el enfoque."));
      if (AVALES.test(n)) out.push(E("El nombre menciona un organismo o promete un aval.", "Quita nombres de entidades y palabras como «avalado» u «oficial»; solo el emisor puede dar su sello."));
      else if (/\b(certific\w*|acredit\w*|internacional)\b/i.test(n)) out.push(W("Revisa si «certificación», «acreditado» o «internacional» promete algo que el emisor no puede respaldar."));
      return out;
    },
    ai: "Específico (tema más enfoque o acción), no genérico; sin marcas, sellos ni promesas de aval de entidades distintas del emisor; coherente con el tipo de aprendizaje de una microcredencial."
  },
  {
    id: 2, short: "Problema y público", title: "Problema y público objetivo", tag: "Diseño iv, viii",
    need: "Describe la necesidad que atiende, a quién va dirigida y qué debe saber hacer quien se inscriba.",
    criteria: ["Describe un problema o necesidad concreta, no un tema genérico.", "Define a quién va dirigida (no «todo el mundo»).", "Indica los conocimientos previos requeridos o declara que no hay."],
    example: ["Problema: las comunidades de barrios de ladera reciben poca información comprensible sobre los riesgos climáticos de su territorio.", "Público: líderes comunitarios, jóvenes y personal de ONG ambientales, mayores de 18 años.", "Conocimientos previos: manejo básico de celular; no se requiere formación en comunicación ni en ciencias del clima."],
    controls: [
      { key: "problema", type: "textarea", label: "Problema o necesidad" },
      { key: "publico", type: "textarea", label: "Público objetivo" },
      { key: "previos", type: "textarea", label: "Conocimientos previos requeridos", hint: "Si no se requiere ninguno, dilo expresamente." }
    ],
    validate(v) {
      const out = [];
      if (clean(v.problema).length < 60) out.push(E("La descripción del problema es muy breve para ser concreta.", "Cuenta quién tiene el problema, dónde y qué consecuencia tiene (mínimo unas dos frases)."));
      if (clean(v.publico).length < 20) out.push(E("Define mejor a quién va dirigida.", "Nombra los grupos concretos."));
      else if (/^\s*(todos|todo el mundo|cualquier persona|el público en general)\b/i.test(v.publico)) out.push(E("«Todos» no define un público.", "Nombra los grupos concretos y su edad o contexto."));
      if (clean(v.previos).length < 4) out.push(E("Falta declarar los conocimientos previos.", "Escribe cuáles se requieren o «No se requieren conocimientos previos»."));
      return out;
    },
    ai: "El problema es concreto (no un tema genérico); el público está definido con grupos concretos; los conocimientos previos están declarados (o se declara que no hay)."
  },
  {
    id: 3, short: "Objetivo", title: "Objetivo", tag: "",
    need: "Una sola oración que diga qué logra quien obtiene la microcredencial.",
    criteria: ["Es una sola oración.", "Dice qué logra el titular, con un verbo observable.", "Es coherente con el problema y el público del campo 2."],
    example: ["Que líderes y jóvenes de una comunidad produzcan y publiquen un contenido digital que explique un riesgo climático de su territorio y recoja la respuesta de su audiencia."],
    controls: [{ key: "objetivo", type: "textarea", label: "Objetivo" }],
    validate(v) {
      const t = clean(v.objetivo), out = [];
      if (!t) return [E("Escribe el objetivo.")];
      const sentences = t.split(/[.!?]+(?:\s|$)/).filter((s) => clean(s));
      if (sentences.length > 1) out.push(E(`Tiene ${sentences.length} oraciones; debe ser una sola.`, "Une las ideas o deja la más importante."));
      const wc = words(t).length;
      if (wc < 8) out.push(E("Es demasiado breve para decir qué logra el titular."));
      if (wc > 45) out.push(E("Es demasiado larga para una sola oración de objetivo.", "Pasa el detalle a los resultados de aprendizaje."));
      const m = t.match(NOT_EVIDENCIABLE);
      if (m) out.push(E(`Usa un verbo difícil de evidenciar: «${m[0]}».`, "Usa un verbo observable (explicar, producir, diseñar, evaluar…)."));
      return out;
    },
    ai: "Una sola oración; dice qué logra el titular con un verbo observable; es coherente con el problema y público del campo 2."
  },
  {
    id: 4, short: "Resultados de aprendizaje", title: "Resultados de aprendizaje", tag: "Diseño v",
    need: "Escribe entre 4 y 6 resultados, uno por fila. Pueden estar en infinitivo («Diseñar…») o en futuro («Diseñará…»).",
    criteria: ["Son entre 4 y 6.", "Cada uno empieza con un verbo observable (diseñar, producir, evaluar…).", "Ninguno usa verbos no evidenciables (conocer, comprender, entender, saber, familiarizarse, apreciar).", "Cada uno se puede demostrar con un producto o desempeño."],
    example: ["1. Diseñar una narrativa que conecte un problema climático local con una experiencia comunitaria.", "2. Explicar el riesgo climático elegido con datos de fuentes verificables.", "3. Producir un video, infografía o podcast con herramientas abiertas y de bajo costo.", "4. Publicar el contenido en un canal accesible para la comunidad.", "5. Evaluar el alcance del contenido con retroalimentación de una audiencia real.", "No cumple: «Comprender el cambio climático», porque «comprender» no se puede evidenciar. Se corrige a «Explicar el riesgo climático elegido con datos de fuentes verificables»."],
    controls: [
      { key: "resultados", type: "rows", label: "Resultados", min: 4, max: 6, addLabel: "Añadir resultado", rowLabel: "Resultado", columns: [{ key: "text", type: "textarea", label: "Resultado", rows: 2 }] },
      { key: "nombreAlineado", type: "check", label: "Confirmo que el nombre del campo 1 sigue alineado con estos resultados.", showName: true }
    ],
    validate(v) {
      const out = [], rows = v.resultados || [];
      if (rows.length < 4 || rows.length > 6) out.push(E(`Hay ${rows.length} resultados; deben ser entre 4 y 6.`));
      rows.forEach((r, i) => {
        const t = clean(r.text);
        if (!t) { out.push(E(`El resultado ${i + 1} está vacío.`, "Escríbelo o elimina la fila.")); return; }
        const first = words(t)[0] || "";
        if (words(t).length < 4) out.push(E(`El resultado ${i + 1} es demasiado breve para ser demostrable.`));
        if (FIRST_NOT_EVIDENCIABLE.test(first)) out.push(E(`El resultado ${i + 1} empieza con «${first}», un verbo difícil de evidenciar.`, "Reescríbelo con un verbo observable, por ejemplo «Explicar…» o «Identificar…»."));
        else if (!LOOKS_VERB.test(first)) out.push(W(`El resultado ${i + 1} no parece empezar con un verbo («${first}»). Verifica que sea observable.`));

function statusLabel(id) { const s = fstate(id).status; return s === "ok" ? "validado con reglas y revisión de Claude" : s === "okdet" ? "validado con reglas automáticas" : "pendiente de validar"; }
function docModel() {

function toMarkdown(m) {
  const L = [`# ${m.title}`, "", m.all ? "Borrador de diseño con los 14 campos aprobados por las reglas de la herramienta. La institución emisora lo valida y lo oficializa." : "**BORRADOR INCOMPLETO:** hay campos sin aprobar. La institución emisora debe validarlo y oficializarlo.", "", `Fecha de elaboración: ${m.date}`, ""];

function buildDocx(m) {
  const D = window.docx;

  const { Document, Paragraph, TextRun, HeadingLevel, Table, TableRow, TableCell, WidthType } = D;
  const kids = [];
  kids.push(new Paragraph({ heading: HeadingLevel.TITLE, children: [new TextRun(m.title)] }));
  kids.push(new Paragraph({ children: [new TextRun({ text: m.all ? "Borrador de diseño con los 14 campos aprobados por las reglas de la herramienta. La institución emisora lo valida y lo oficializa." : "BORRADOR INCOMPLETO: hay campos sin aprobar. La institución emisora debe validarlo y oficializarlo.", italics: true, bold: !m.all })] }));
  kids.push(new Paragraph({ children: [new TextRun("Fecha de elaboración: " + m.date)], spacing: { after: 200 } }));
  m.sections.forEach((s) => {
    kids.push(new Paragraph({ heading: HeadingLevel.HEADING_1, children: [new TextRun(`Campo ${s.n}. ${s.title}`)] }));
    kids.push(new Paragraph({ children: [new TextRun({ text: "Estado: " + s.status, italics: true, size: 18, color: "666666" })] }));
    s.blocks.forEach((b) => {
      if (b.t === "p") kids.push(new Paragraph({ children: [new TextRun(b.v)], spacing: { after: 120 } }));
      else if (b.t === "li") kids.push(new Paragraph({ children: [new TextRun(b.v)], bullet: { level: 0 } }));
      else if (b.t === "kv") kids.push(new Paragraph({ children: [new TextRun({ text: b.k + ": ", bold: true }), new TextRun(b.v)], spacing: { after: 120 } }));
      else if (b.t === "table") {
        const cell = (txt, bold) => new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: String(txt), bold: !!bold })] })] });
        kids.push(new Table({ width: { size: 100, type: WidthType.PERCENTAGE }, rows: [new TableRow({ children: b.head.map((x) => cell(x, true)) })].concat(b.rows.map((r) => new TableRow({ children: r.map((x) => cell(x)) }))) }));
        kids.push(new Paragraph({ children: [] }));
      }
    });
  });
  kids.push(new Paragraph({ heading: HeadingLevel.HEADING_1, children: [new TextRun("Revisión final")] }));
  m.checklist.forEach((c) => kids.push(new Paragraph({ children: [new TextRun({ text: c.label + ": ", bold: true }), new TextRun({ text: c.status + ". ", bold: true }), new TextRun(c.note)], bullet: { level: 0 } })));
  kids.push(new Paragraph({ heading: HeadingLevel.HEADING_2, children: [new TextRun("Puntos más débiles")] }));
